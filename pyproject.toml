[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-ai"
version = "0.1.0"
description = "Checker, deterministic router, and API for the SatQuery AI prototype"
requires-python = ">=3.12"
dependencies = [
  "affine>=3,<4",
  "fastapi>=0.141,<0.142",
  "numpy>=2,<3",
  "pydantic>=2.13,<3",
  "python-multipart>=0.0.20,<1",
  "rasterio>=1.5,<1.6",
  "uvicorn[standard]>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
]

[tool.setuptools.packages.find]
include = ["apps*", "satquery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
